# vivado-container-suite -- built-in defaults.
#
# Precedence, lowest to highest:
#   1. this file
#   2. <project>/vcs.conf
#   3. <project>/vcs.local.conf      (git-ignored, machine specific)
#   4. VCS_* environment variables
#   5. command line flags
#
# Every key is documented in docs/02-configuration.md.

## --- toolchain --------------------------------------------------------------
VCS_VIVADO_VERSION=2025.2
VCS_VIVADO_EDITION=Vivado
VCS_XILINX_ROOT=/tools/Xilinx
# mount = bind the host install | image = baked in | none = no Vivado at all
VCS_VIVADO_MODE=mount

## --- image ------------------------------------------------------------------
VCS_IMAGE_NAME=vivado-container-suite
VCS_IMAGE_TAG=
VCS_IMAGE=
VCS_ENGINE=auto
VCS_PLATFORM=linux/amd64
VCS_CA_CERT=

## --- project layout (paths are relative to the project root) ----------------
VCS_PROJECT_NAME=
VCS_BUILD_DIR=build
VCS_SOURCES=
VCS_VHDL_SOURCES=
VCS_SV_SOURCES=
VCS_CONSTRAINTS=
VCS_IP=
VCS_BD=
VCS_TOP=
VCS_PART=
VCS_BOARD_PART=
VCS_FLOW_MODE=nonproject
VCS_XPR=
VCS_SYNTH_ARGS=
VCS_IMPL_DIRECTIVE=
VCS_ALLOW_TIMING_VIOLATION=0
VCS_GENERICS=
VCS_INCLUDE_DIRS=
VCS_PRE_TCL=
VCS_POST_TCL=

## --- simulation -------------------------------------------------------------
VCS_SIM_TOP=
VCS_SIM_SOURCES=
VCS_SIM_VHDL_SOURCES=
VCS_SIM_TIME=
VCS_SIM_LIBS=
VCS_SIM_XELAB_ARGS=
VCS_SIM_XVLOG_ARGS=

## --- licensing --------------------------------------------------------------
# Forms: "port@host" | "/abs/path/to/Xilinx.lic" | "dir:/abs/path" | "none"
VCS_LICENSE=
VCS_XILINX_DOTDIR=

## --- runtime ----------------------------------------------------------------
VCS_DISPLAY_MODE=auto
# VNC: only meaningful with a headless (xvfb) display.  The password is never
# put in an environment variable or an argv -- see lib/display.sh.
VCS_VNC=0
VCS_VNC_PORT=5901
VCS_VNC_BIND=127.0.0.1
VCS_VNC_PASSWORD=
VCS_JTAG_MODE=host
VCS_HW_SERVER_PORT=3121
VCS_CACHE_DIR=
VCS_JOBS=
VCS_MEMORY=
VCS_CPUS=
VCS_EXTRA_MOUNTS=
VCS_EXTRA_ENV=
VCS_EXTRA_RUN_ARGS=
VCS_NETWORK=
VCS_USER_MODE=match
VCS_TMPFS_SIZE=
VCS_SELFTEST_REQUIRE_VIVADO=1
