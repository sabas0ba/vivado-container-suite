# vivado-container-suite -- built-in defaults.
#
# Precedence, lowest to highest:
#   1. this file
#   2. <project>/vvd.conf
#   3. <project>/vvd.local.conf      (git-ignored, machine specific)
#   4. VVD_* environment variables
#   5. command line flags
#
# Every key is documented in docs/02-configuration.md.

## --- toolchain --------------------------------------------------------------
VVD_VIVADO_VERSION=2025.2
VVD_VIVADO_EDITION=Vivado
VVD_XILINX_ROOT=/tools/Xilinx
# mount = bind the host install | image = baked in | none = no Vivado at all
VVD_VIVADO_MODE=mount

## --- image ------------------------------------------------------------------
VVD_IMAGE_NAME=vivado-container-suite
VVD_IMAGE_TAG=
VVD_IMAGE=
VVD_ENGINE=auto
VVD_PLATFORM=linux/amd64
VVD_CA_CERT=

## --- project layout (paths are relative to the project root) ----------------
VVD_PROJECT_NAME=
VVD_BUILD_DIR=build
VVD_SOURCES=
VVD_VHDL_SOURCES=
VVD_SV_SOURCES=
VVD_CONSTRAINTS=
VVD_IP=
VVD_BD=
VVD_TOP=
VVD_PART=
VVD_BOARD_PART=
VVD_FLOW_MODE=nonproject
VVD_XPR=
VVD_SYNTH_ARGS=
VVD_IMPL_DIRECTIVE=
VVD_ALLOW_TIMING_VIOLATION=0
VVD_GENERICS=
VVD_INCLUDE_DIRS=
VVD_PRE_TCL=
VVD_POST_TCL=

## --- simulation -------------------------------------------------------------
VVD_SIM_TOP=
VVD_SIM_SOURCES=
VVD_SIM_VHDL_SOURCES=
VVD_SIM_TIME=
VVD_SIM_LIBS=
VVD_SIM_XELAB_ARGS=
VVD_SIM_XVLOG_ARGS=

## --- licensing --------------------------------------------------------------
# Forms: "port@host" | "/abs/path/to/Xilinx.lic" | "dir:/abs/path" | "none"
VVD_LICENSE=
VVD_XILINX_DOTDIR=

## --- runtime ----------------------------------------------------------------
VVD_DISPLAY_MODE=auto
# VNC: only meaningful with a headless (xvfb) display.  The password is never
# put in an environment variable or an argv -- see lib/display.sh.
VVD_VNC=0
VVD_VNC_PORT=5901
VVD_VNC_BIND=127.0.0.1
VVD_VNC_PASSWORD=
VVD_JTAG_MODE=host
VVD_HW_SERVER_PORT=3121
VVD_CACHE_DIR=
VVD_JOBS=
VVD_MEMORY=
VVD_CPUS=
VVD_EXTRA_MOUNTS=
VVD_EXTRA_ENV=
VVD_EXTRA_RUN_ARGS=
VVD_NETWORK=
VVD_USER_MODE=match
VVD_TMPFS_SIZE=
VVD_SELFTEST_REQUIRE_VIVADO=1
