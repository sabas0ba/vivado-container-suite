# Development / CI tooling, pinned.
#
# Two record types:
#   bin|<name>|<url>|<sha256>          a single executable, verified then chmod +x
#   tar|<name>|<url>|<sha256>|<strip>  a tarball, verified then extracted
#   git|<name>|<repo-url>|<commit>     a git checkout pinned to a commit object
#
# Git commit IDs are content-addressed, so a commit pin is as strong as a
# checksum -- and stronger than a release tarball, whose bytes are regenerated
# by the forge.

