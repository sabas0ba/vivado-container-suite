# Example project: an LED blinker for a 7-series board.
#
# Every key is documented in docs/02-configuration.md.  Machine-specific values
# (license server, Vivado location) belong in vvd.local.conf, which is
# git-ignored, or in the environment -- not here.

VVD_PROJECT_NAME=blinky

## --- device -----------------------------------------------------------------
# Digilent Arty A7-35T.  Change the part to match your board; the design itself
# is device independent.
VVD_PART=xc7a35ticsg324-1L
VVD_TOP=blinky

## --- sources ----------------------------------------------------------------
VVD_SOURCES=rtl/*.v
VVD_CONSTRAINTS=constr/*.xdc
VVD_GENERICS=CLK_HZ=100000000 BLINK_HZ=2

## --- simulation -------------------------------------------------------------
VVD_SIM_TOP=tb_blinky
VVD_SIM_SOURCES=sim/*.v
# The testbench overrides the divider so it finishes in microseconds.
VVD_SIM_TIME=20us

## --- output -----------------------------------------------------------------
VVD_BUILD_DIR=build
